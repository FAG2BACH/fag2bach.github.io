<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tu perfil emprendedor</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f6f5f1; --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
    --acento:#2a78d6; --acento-suave:rgba(42,120,214,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark;
      --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
      --acento:#3987e5; --acento-suave:rgba(57,135,229,.22); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-text-size-adjust:100%; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1,h2,h3,p { margin:0; }
  h1 { font-size:clamp(28px,6vw,44px); line-height:1.1; letter-spacing:-.02em; font-weight:700; }
  h2 { font-size:20px; letter-spacing:-.01em; font-weight:650; }
  h3 { font-size:16px; font-weight:650; }
  .eyebrow { font-size:12px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .lead { color:var(--ink2); font-size:17px; max-width:56ch; }
  .sub { color:var(--ink2); font-size:14px; }
  .muted { color:var(--muted); }
  [hidden] { display:none !important; }

  /* búsqueda */
  .buscar { min-height:calc(100vh - 88px); display:grid; align-content:center; gap:20px; max-width:560px; margin:0 auto; }
  .buscar form { display:grid; gap:10px; margin-top:6px; }
  label { font-size:14px; font-weight:600; }
  input { font:inherit; font-size:17px; height:52px; padding:0 16px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink); width:100%; }
  input:focus-visible, .btn:focus-visible { outline:3px solid var(--acento); outline-offset:2px; }
  .btn { font:inherit; font-weight:650; font-size:16px; height:52px; padding:0 22px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; }
  .btn.primario { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .btn:disabled { opacity:.6; cursor:progress; }
  .error { color:#c2352f; font-size:14px; min-height:1.4em; }
  @media (prefers-color-scheme: dark) { .error { color:#ff8a80; } }
  .nota { font-size:13px; color:var(--muted); }

  /* informe */
  .informe { display:grid; gap:18px; }
  .saludo { display:grid; gap:6px; padding:8px 0 4px; }
  .saludo h1:focus { outline:none; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px; min-width:0; }
  .card > .sub { margin-top:4px; }
  .hero { display:grid; gap:18px; }
  .indice .num { font-size:clamp(64px,16vw,92px); line-height:1; font-weight:750; letter-spacing:-.04em; margin-top:10px; }
  .indice .num small { font-size:.38em; color:var(--ink2); font-weight:650; margin-left:2px; letter-spacing:0; }
  .nivel { font-size:20px; font-weight:700; margin-top:6px; }
  .medidor { height:12px; border-radius:6px; background:var(--grid); margin:16px 0 8px; overflow:hidden; }
  .medidor i { display:block; height:100%; background:var(--acento); border-radius:6px; }
  .tipo { position:relative; padding-left:30px; overflow:hidden; }
  .tipo::before { content:""; position:absolute; left:0; top:0; bottom:0; width:9px; background:var(--tipo); }
  .tipo h2 { font-size:clamp(28px,6vw,36px); line-height:1.1; letter-spacing:-.02em; margin:8px 0 4px; }
  .tipo .lema { color:var(--ink2); font-style:italic; margin-bottom:12px; }
  .tipo p + p { margin-top:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px; border:1px solid var(--border); font-size:14px; background:var(--wash); }
  .pto { width:10px; height:10px; border-radius:50%; background:var(--c, var(--acento)); flex:none; }

  .votos { display:grid; gap:12px; margin-top:16px; }
  .voto { display:grid; grid-template-columns:minmax(110px,150px) 1fr 64px; gap:12px; align-items:center; font-size:15px; }
  .voto .pista { height:16px; border-radius:8px; background:var(--grid); overflow:hidden; }
  .voto .pista i { display:block; height:100%; border-radius:8px; background:var(--c); min-width:6px; }
  .voto .n { text-align:right; color:var(--ink2); font-variant-numeric:tabular-nums; }
  .voto.top .nombre { font-weight:700; }

  .dims { display:grid; gap:20px; margin-top:12px; }
  .dims svg { width:100%; max-width:380px; height:auto; margin:0 auto; display:block; }
  .lista-dims { display:grid; gap:16px; align-content:center; }
  .dim .cab { display:flex; justify-content:space-between; gap:12px; font-weight:650; }
  .dim .cab span:last-child { font-variant-numeric:tabular-nums; }
  .dim .pista { height:8px; border-radius:4px; background:var(--grid); margin:6px 0; overflow:hidden; }
  .dim .pista i { display:block; height:100%; background:var(--acento); border-radius:4px; }
  .dim p { color:var(--ink2); font-size:14.5px; }

  .fuertes { display:grid; gap:14px; margin-top:14px; }
  .fuerte { border:1px solid var(--border); border-radius:14px; padding:16px; background:var(--wash); }
  .fuerte p { color:var(--ink2); font-size:14.5px; margin-top:4px; }
  .fuerte .cab { display:flex; justify-content:space-between; gap:12px; font-weight:650; }

  .resps { display:grid; gap:12px; margin-top:14px; }
  .resp { border:1px solid var(--border); border-radius:14px; padding:16px; display:grid; gap:8px; align-content:start; }
  .resp .q { font-size:13.5px; color:var(--muted); }
  .resp .q b { color:var(--ink2); font-weight:650; margin-right:4px; }
  .resp .a { font-weight:600; }
  .resp .f { color:var(--ink2); font-size:14.5px; }
  .resp .chip { justify-self:start; font-size:13px; padding:3px 10px; }

  .calculo p { font-size:14px; color:var(--ink2); margin-top:8px; }
  .acciones { display:flex; flex-wrap:wrap; gap:10px; }
  .pie { font-size:12.5px; color:var(--muted); text-align:center; margin-top:6px; }

  @media (min-width:820px) {
    .hero { grid-template-columns:5fr 6fr; align-items:stretch; }
    .dims { grid-template-columns:minmax(300px,380px) 1fr; align-items:center; }
    .fuertes { grid-template-columns:1fr 1fr; }
    .resps { grid-template-columns:1fr 1fr; }
  }
  @media (max-width:520px) { .voto { grid-template-columns:112px 1fr 52px; gap:8px; font-size:14px; } .card { padding:18px; } }
  @media print {
    body { background:#fff; color:#000; }
    .wrap { padding:0; max-width:none; }
    .no-print { display:none !important; }
    .card, .resp, .fuerte { break-inside:avoid; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>

// colores de los tipos (claro y oscuro)
const st = document.createElement('style');
const colores = (i) => Object.entries(MODELO.tipos).map(([k, t]) => `--tipo-${k}:${t.color[i]};`).join('');
st.textContent = `:root{${colores(0)}}@media (prefers-color-scheme: dark){:root{${colores(1)}}}`;
document.head.append(st);

/* ---------- nombre -> combinaciones (igual que en Python) ---------- */
function palabras(texto) {
  return texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(t => t && !PARTICULAS.has(t));
}
function combos(arr, k, ini = 0, acc = [], out = []) {
  if (acc.length === k) { out.push(acc.join(' ')); return out; }
  for (let i = ini; i < arr.length; i++) combos(arr, k, i + 1, [...acc, arr[i]], out);
  return out;
}
function combinaciones(pals) {
  pals = [...pals].sort(); const n = pals.length, tam = new Set([n]); if (n >= 2) { tam.add(2); tam.add(3); }
  const todas = new Set(); for (const k of tam) if (k <= n) combos(pals, k).forEach(c => todas.add(c));
  return [...todas].sort((a, b) => b.split(' ').length - a.split(' ').length);
}

/* ---------- criptografía ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function huella(c) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fag1|' + c));
  return [...new Uint8Array(h)].slice(0, 6).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function abrir(rec, comb) {
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(comb), 'PBKDF2', false, ['deriveKey']);
    const clave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(rec.s), iterations: MODELO.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.i) }, clave, b64(rec.c));
    return JSON.parse(new TextDecoder().decode(claro));
  } catch (e) { return null; }
}
async function buscar(texto) {
  const pals = palabras(texto);
  if (pals.length < 2) return { error: 'Escribe al menos tu nombre y un apellido.' };
  if (!window.crypto || !crypto.subtle) return { error: 'Este navegador no puede abrir los resultados desde esta dirección. Prueba con otro navegador.' };
  for (const c of combinaciones(pals)) {
    const recs = TABLA[await huella(c)]; if (!recs) continue;
    const hallados = (await Promise.all(recs.map(r => abrir(r, c)))).filter(Boolean);
    if (hallados.length === 1) return { datos: hallados[0] };
    if (hallados.length > 1) return { error: 'Hay más de una persona con ese nombre. Añade tu segundo apellido.' };
  }
  return { error: 'No encontramos ese nombre. Escríbelo como lo pusiste en el test, con tus apellidos.' };
}

/* ---------- informe ---------- */
function radar(p) {
  const W = 380, H = 330, cx = 190, cy = 165, R = 105, n = MODELO.dims.length;
  const ang = i => Math.PI / 2 - 2 * Math.PI * i / n, pt = (i, v) => [cx + R * v / 100 * Math.cos(ang(i)), cy - R * v / 100 * Math.sin(ang(i))];
  const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Radar con tus cinco dimensiones: ' + MODELO.dims.map(d => `${d.corto} ${fmt(p.d[d.k])}`).join(', ') });
  [25, 50, 75, 100].forEach(a => svg.append(S('polygon', { points: MODELO.dims.map((_, i) => pt(i, a).join(',')).join(' '), fill: 'none', stroke: 'var(--grid)', 'stroke-width': 1 })));
  MODELO.dims.forEach((d, i) => { const [x, y] = pt(i, 100); svg.append(S('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: 'var(--grid)' })); });
  svg.append(S('polygon', { points: MODELO.dims.map((d, i) => pt(i, p.d[d.k]).join(',')).join(' '), fill: 'var(--acento-suave)', stroke: 'var(--acento)', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
  MODELO.dims.forEach((d, i) => { const [x, y] = pt(i, p.d[d.k]); svg.append(S('circle', { cx: x, cy: y, r: 6.5, fill: 'var(--surface)' }), S('circle', { cx: x, cy: y, r: 4.5, fill: 'var(--acento)' })); });
  MODELO.dims.forEach((d, i) => {
    const [x, y] = pt(i, 100), c = Math.cos(ang(i)), s = Math.sin(ang(i)), lx = cx + (R + 16) * c, ly = cy - (R + 16) * s;
    svg.append(S('text', { x: lx, y: ly + (s > .5 ? -2 : s < -.5 ? 12 : 4), 'text-anchor': c > .3 ? 'start' : c < -.3 ? 'end' : 'middle', style: 'font:600 14px system-ui,sans-serif;fill:var(--ink)' }, d.corto));
  });
  return svg;
}
const nivelDim = v => v >= 70 ? 'alto' : v >= 40 ? 'medio' : 'bajo';

function informe(p) {
  const tipo = MODELO.tipos[p.t], tipo2 = MODELO.tipos[p.t2], nivel = MODELO.niveles.find(n => p.g >= n.min) || MODELO.niveles.at(-1);
  const total = Object.values(p.v).reduce((a, b) => a + b, 0), maxVotos = Math.max(...Object.values(p.v));
  const primero = p.n.split(' ')[0];
  const raiz = E('article', { class: 'informe', id: 'vista-informe' });
  raiz.style.setProperty('--tipo', `var(--tipo-${p.t})`);

  raiz.append(E('header', { class: 'saludo' }, E('p', { class: 'eyebrow', text: 'Tu perfil emprendedor' }), E('h1', { tabindex: '-1', id: 'titulo', text: `Hola, ${primero}` }), E('p', { class: 'sub', text: `Resultado de ${p.n}` })));

  raiz.append(E('section', { class: 'hero' },
    E('div', { class: 'card indice' }, E('p', { class: 'eyebrow', text: 'Índice de perfil emprendedor' }),
      E('p', { class: 'num' }, fmt(p.g), E('small', { text: '%' })), E('p', { class: 'nivel', text: nivel.nombre }),
      E('div', { class: 'medidor', role: 'img', 'aria-label': `${fmt(p.g)} de 100` }, E('i', { style: `width:${Math.max(2, p.g)}%` })),
      E('p', { class: 'sub', text: nivel.frase }), E('p', { class: 'sub', style: 'margin-top:10px', text: 'No es una nota: indica cuánto se parece tu forma de actuar al perfil emprendedor típico de este test.' })),
    E('div', { class: 'card tipo' }, E('p', { class: 'eyebrow', text: 'Tu tipo de emprendedor' }), E('h2', { text: tipo.nombre }), E('p', { class: 'lema', text: tipo.lema }),
      E('p', { text: tipo.descr }), E('p', { text: tipo.equipo }),
      E('div', { class: 'chips' }, E('span', { class: 'chip' }, E('span', { class: 'pto', style: `--c:var(--tipo-${p.t2})` }), `Segundo tipo: ${tipo2.nombre}`),
        ...tipo.encaja.map(k => E('span', { class: 'chip' }, E('span', { class: 'pto', style: `--c:var(--tipo-${k})` }), `Encajas con ${MODELO.tipos[k].nombre.toLowerCase()}`))))));

  raiz.append(E('section', { class: 'card' }, E('h2', { text: 'Cómo se reparten tus respuestas' }),
    E('p', { class: 'sub', text: 'Cada respuesta que diste apunta a un tipo de emprendedor. El tuyo es el que más aparece.' }),
    E('div', { class: 'votos' }, Object.entries(MODELO.tipos).sort((a, b) => p.v[b[0]] - p.v[a[0]]).map(([k, t]) => E('div', { class: 'voto' + (p.v[k] === maxVotos ? ' top' : '') },
      E('span', { class: 'nombre', text: t.nombre }), E('span', { class: 'pista' }, E('i', { style: `--c:var(--tipo-${k});width:${p.v[k] / total * 100}%` })), E('span', { class: 'n', text: `${p.v[k]} de ${total}` }))))));

  raiz.append(E('section', { class: 'card' }, E('h2', { text: 'Tu perfil por dimensiones' }),
    E('p', { class: 'sub', text: 'Cinco formas de actuar, de 0 a 100. Cada una combina varias de tus respuestas.' }),
    E('div', { class: 'dims' }, radar(p), E('div', { class: 'lista-dims' }, MODELO.dims.map(d => E('div', { class: 'dim' },
      E('div', { class: 'cab' }, E('span', { text: d.nombre }), E('span', { text: fmt(p.d[d.k]) })), E('div', { class: 'pista' }, E('i', { style: `width:${Math.max(2, p.d[d.k])}%` })), E('p', { text: d.estilo[nivelDim(p.d[d.k])] })))))));

  raiz.append(E('section', { class: 'card' }, E('h2', { text: 'Lo que más destaca de ti' }),
    E('div', { class: 'fuertes' }, p.f.map(k => { const d = MODELO.dims.find(x => x.k === k); return E('div', { class: 'fuerte' }, E('div', { class: 'cab' }, E('span', { text: d.nombre }), E('span', { text: fmt(p.d[k]) })), E('p', { text: d.descr }), E('p', { style: 'color:var(--ink)', text: d.estilo[nivelDim(p.d[k])] })); }))));

  raiz.append(E('section', { class: 'card' }, E('h2', { text: 'Tus respuestas, una a una' }),
    E('p', { class: 'sub', text: 'Qué dice de ti cada cosa que elegiste.' }),
    E('div', { class: 'resps' }, MODELO.preguntas.map((q, i) => {
      const o = q.opciones[p.r[i]]; if (!o) return null;
      return E('div', { class: 'resp' }, E('p', { class: 'q' }, E('b', { text: `${q.n}.` }), q.texto), E('p', { class: 'a', text: `«${o.texto}»` }), E('p', { class: 'f', text: o.frase }),
        E('span', { class: 'chip' }, E('span', { class: 'pto', style: `--c:var(--tipo-${o.tipo})` }), MODELO.tipos[o.tipo].nombre));
    }))));

  raiz.append(E('section', { class: 'card calculo' }, E('h2', { text: 'Cómo se ha calculado' }),
    E('p', { text: `Tu índice sale de 13 respuestas que valen 0, 1 o 2 puntos cada una (máximo ${MODELO.max}): el total dividido entre el máximo, por 100. Tu tipo es el que más aparece entre tus respuestas. Cada dimensión se calcula con las dos o tres preguntas que la miden.` }),
    E('p', { text: 'Es un test de autopercepción: una foto de cómo te ves hoy, no una nota ni un diagnóstico. Si lo repites dentro de un tiempo, es normal que cambie.' })));

  raiz.append(E('div', { class: 'acciones no-print' }, E('button', { class: 'btn primario', type: 'button', id: 'pdf', text: 'Guardar como PDF' }), E('button', { class: 'btn', type: 'button', id: 'otra', text: 'Buscar a otra persona' })));
  raiz.append(E('p', { class: 'pie no-print', text: 'Tus resultados están cifrados y solo se abren con tu nombre.' }));
  return raiz;
}

/* ---------- interacción ---------- */
let ultimo = null;
function mostrar(p) {
  ultimo = p;
  const nuevo = informe(p);
  $('#vista-informe').replaceWith(nuevo);
  $('#vista-buscar').hidden = true; nuevo.hidden = false;
  document.title = 'Tu perfil emprendedor · ' + p.n.split(' ')[0];
  window.scrollTo(0, 0); $('#titulo').focus({ preventScroll: true });
  $('#pdf').onclick = () => window.print();
  $('#otra').onclick = () => { ultimo = null; nuevo.hidden = true; $('#nombre').value = ''; $('#error').textContent = ''; $('#vista-buscar').hidden = false; document.title = 'Tu perfil emprendedor'; $('#nombre').focus(); };
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#btn'), err = $('#error'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Buscando…';
  try { const r = await buscar($('#nombre').value); if (r.datos) mostrar(r.datos); else err.textContent = r.error; }
  catch (x) { err.textContent = 'Ha pasado algo inesperado. Recarga la página e inténtalo otra vez.'; }
  finally { btn.disabled = false; btn.textContent = 'Ver mi resultado'; }
});
</script>
