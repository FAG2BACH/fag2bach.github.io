  :root {
    color-scheme: light;
    --suelo:#eef0f4; --papel:#ffffff; --tinta:#0f1115; --tinta2:#464b55; --suave:#6d7380;
    --linea:rgba(15,17,21,.14); --lavado:rgba(15,17,21,.05); --anillo:#ffffff;
    --foco:#2a78d6; --marca:#0f1115; --marca-txt:#ffffff; --oro:#d3b341;
    --nv0:#86b6ef; --nv1:#3987e5; --nv2:#1c5cab; --nv3:#0d366b;
    --display:"Bricolage Grotesque","Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --texto:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --salida:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark;
      --suelo:#0d0e11; --papel:#171a1f; --tinta:#f2f3f5; --tinta2:#c2c6cf; --suave:#8d93a0;
      --linea:rgba(255,255,255,.16); --lavado:rgba(255,255,255,.06); --anillo:#171a1f;
      --foco:#6aa6f0; --marca:#f2f3f5; --marca-txt:#0f1115;
      --nv0:#184f95; --nv1:#256abf; --nv2:#3987e5; --nv3:#86b6ef; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--suelo); color:var(--tinta); font:16px/1.55 var(--texto); }
  h1,h2,h3,p,ol,ul { margin:0; padding:0; }
  ol,ul { list-style:none; }
  [hidden] { display:none !important; }
  a { color:inherit; }
  ::selection { background:var(--foco); color:#fff; }
  :focus-visible { outline:3px solid var(--foco); outline-offset:3px; border-radius:6px; }
  button { font:inherit; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }

  /* ---------- cabecera ---------- */
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:1080px; margin:0 auto; padding:18px 20px; }
  .marca { display:flex; align-items:center; gap:12px; text-decoration:none; font:700 15px/1.2 var(--display); letter-spacing:-.01em; }
  .marca .placa { display:grid; place-items:center; background:#fff; border-radius:12px; height:44px; padding:0 10px; box-shadow:0 0 0 1px var(--linea); }
  .marca .placa img { height:28px; width:auto; display:block; }
  .filete { height:3px; background:var(--oro); }
  .marca .sello { display:flex; gap:3px; }
  .top nav { display:flex; gap:4px; }
  .top nav a { display:inline-flex; align-items:center; height:44px; text-decoration:none; padding:0 18px; border-radius:999px; font-size:14px; font-weight:600; color:var(--tinta2); }
  .top nav a[aria-current="page"] { background:var(--marca); color:var(--marca-txt); }
  .top nav a:not([aria-current="page"]):hover { background:var(--lavado); }
  .top nav a { white-space:nowrap; }
  @media (max-width:520px) { .top { padding:12px 16px; } .marca > span:last-child { display:none; } .top nav a { padding:0 14px; } }

  /* ---------- búsqueda ---------- */
  .buscar { max-width:640px; margin:0 auto; padding:clamp(28px,9vh,96px) 20px 80px; display:grid; gap:28px; }
  .buscar .fichas { display:flex; gap:10px; align-items:flex-end; }
  .buscar h1 { font:800 clamp(2.5rem,11vw,4.75rem)/.98 var(--display); letter-spacing:-.012em; text-wrap:balance; }
  .buscar .intro { font-size:18px; color:var(--tinta2); max-width:46ch; }
  .buscar form { display:grid; gap:10px; max-width:480px; }
  .buscar label { font-weight:650; font-size:15px; }
  input[type=text], input[type=password] { font:inherit; font-size:18px; height:58px; padding:0 18px; border-radius:16px; border:2px solid var(--linea); background:var(--papel); color:var(--tinta); width:100%; }
  input[type=text]:focus, input[type=password]:focus { border-color:var(--tinta); outline:none; }
  input[type=text]:focus-visible, input[type=password]:focus-visible { outline:3px solid var(--foco); outline-offset:2px; }
  .boton { height:58px; padding:0 26px; border-radius:16px; border:0; background:var(--marca); color:var(--marca-txt); font:700 17px var(--display); cursor:pointer; transition:transform .15s var(--salida); }
  .boton:active { transform:scale(.98); }
  .boton:disabled { opacity:.6; cursor:progress; }
  .boton.claro { background:transparent; color:var(--tinta); border:2px solid var(--linea); }
  .error { color:#b3261e; font-size:15px; min-height:1.5em; }
  @media (prefers-color-scheme: dark) { .error { color:#ff9a92; } }
  .nota { font-size:14px; color:var(--suave); max-width:46ch; }

  /* ---------- portada del resultado ---------- */
  .portada { --suelo-hero:var(--suelo); --txt-hero:var(--tinta); --txt2-hero:var(--tinta2); --raya-hero:var(--linea);
    background:var(--suelo-hero); color:var(--txt-hero); transition:background-color .7s var(--salida), color .7s var(--salida); }
  .portada.listo { --suelo-hero:var(--hero); --txt-hero:var(--hero-txt); --txt2-hero:var(--hero-txt2); --raya-hero:var(--hero-raya); }
  .portada .dentro { max-width:1080px; margin:0 auto; padding:clamp(16px,3vw,40px) 20px clamp(32px,6vw,72px); display:grid; gap:clamp(24px,4vw,40px) clamp(28px,5vw,64px); }
  .portada h1 { font:800 clamp(2.75rem,13vw,5.5rem)/.95 var(--display); letter-spacing:-.012em; text-wrap:balance; opacity:0; transform:translateY(14px); transition:opacity .6s var(--salida) .15s, transform .6s var(--salida) .15s; }
  .portada .lema { font:italic 500 clamp(1.1rem,3.6vw,1.5rem)/1.3 var(--texto); color:var(--txt2-hero); margin-top:14px; max-width:28ch; opacity:0; transition:opacity .6s var(--salida) .3s; }
  .portada .hola { font-size:17px; color:var(--txt2-hero); margin-top:18px; opacity:0; transition:opacity .6s var(--salida) .4s; }
  .portada.listo h1, .portada.listo .lema, .portada.listo .hola { opacity:1; transform:none; }
  .portada .emblema { width:clamp(72px,18vw,112px); height:auto; display:block; margin-bottom:18px; opacity:0; transform:scale(.7); transition:opacity .5s var(--salida) .05s, transform .6s var(--salida) .05s; }
  .portada.listo .emblema { opacity:1; transform:none; }

  .tubos { display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(8px,2.4vw,18px); align-items:end; max-width:520px; }
  .tubo { display:grid; gap:8px; justify-items:center; }
  .pila { width:100%; height:var(--alto); display:flex; flex-direction:column-reverse; align-items:center; justify-content:flex-start; gap:var(--hueco); padding:8px 0; border:2.5px solid var(--raya-hero); border-radius:18px 18px 26px 26px; transition:border-color .6s var(--salida); }
  .tubo.gana .pila { border-color:var(--txt-hero); }
  .ficha { display:block; padding:0; border:0; background:none; cursor:pointer; line-height:0; border-radius:50%; }
  .ficha svg { display:block; width:var(--ficha); height:var(--ficha); }
  .tubo .cuenta { font:700 22px/1 var(--display); font-synthesis:none; }
  .tubo:not(.gana) .cuenta { color:var(--txt2-hero); font-weight:600; }
  .claves { margin-top:20px; display:grid; gap:7px; font-size:15px; max-width:520px; }
  .claves li { display:flex; align-items:center; gap:10px; color:var(--txt2-hero); }
  .claves li.gana { color:var(--txt-hero); font-weight:700; }
  .claves .n { margin-left:auto; font-variant-numeric:tabular-nums; }

  .puntos { max-width:520px; }
  .puntos .cifra { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .puntos strong { font:800 clamp(2rem,8vw,2.75rem)/1 var(--display); letter-spacing:-.012em; }
  .puntos .nivel { font:700 18px var(--display); color:var(--txt-hero); }
  .sellos { display:grid; grid-template-columns:repeat(13,1fr); gap:4px; margin:14px 0 12px; }
  .sellos i { aspect-ratio:1; border-radius:5px; border:2px solid var(--raya-hero); }
  .sellos i.on { background:var(--txt-hero); border-color:var(--txt-hero); }
  .puntos p { color:var(--txt2-hero); font-size:15px; }

  @media (min-width:900px) {
    .portada .dentro { grid-template-columns:1.05fr 1fr; grid-template-areas:"texto tubos" "puntos tubos"; align-items:center; row-gap:36px; }
    .portada .dentro > .texto { grid-area:texto; align-self:end; }
    .portada .dentro > .puntos { grid-area:puntos; align-self:start; }
    .portada .dentro > .tubos-col { grid-area:tubos; justify-self:end; width:100%; max-width:520px; }
  }

  /* ---------- secciones ---------- */
  .bloque { max-width:1080px; margin:0 auto; padding:clamp(40px,7vw,88px) 20px 0; display:grid; gap:24px; }
  .bloque > * { min-width:0; }
  .bloque > h2 { overflow-wrap:anywhere; font:800 clamp(1.75rem,6vw,2.75rem)/1.04 var(--display); letter-spacing:-.012em; text-wrap:balance; max-width:20ch; }
  .bloque .sub { color:var(--tinta2); max-width:60ch; font-size:17px; }

.", "tipo": "riesgo", "frase": "Pruebas tu idea y la defiendes con transparencia: innovas a la vista de todos."}, {"texto": "Lo haces a tu manera sin comentarlo y esperas que cuele.", "tipo": "autonomia", "frase": "Confías en tu criterio y pruebas tu camino sin esperar permiso."}]}, {"n": 7, "texto": "Te regalan 350€ por tu cumpleaños. Lo más probable es que...", "opciones": [{"texto": "Los gastes pronto en algo que te apetezca.", "tipo": "iniciativa", "frase": "Actúas rápido y disfrutas de lo que consigues: vives el presente."}, {"texto": "Los guardes todos en el banco sin tocarlos.", "tipo": "persistencia", "frase": "Eres constante y prudente: vas acumulando poco a poco."}, {"texto": "Los uses para algo que pueda devolverte más dinero o experiencias.", "tipo": "valor", "frase": "Piensas en el retorno: que tu dinero y tu tiempo trabajen para ti."}]}, {"n": 8, "texto": "Tienes una idea para un proyecto que podrías empezar ya pero nadie te asegura el éxito.", "opciones": [{"texto": "Esperas a tener todo muy claro y a que te den el visto bueno.", "tipo": "valor", "frase": "Quieres bases sólidas antes de moverte: prefieres decidir con información."}, {"texto": "La descartas, porque no merece la pena arriesgarse.", "tipo": "valor", "frase": "Cuidas tu energía y tus recursos, y eliges bien tus batallas."}, {"texto": "La pones en marcha a pequeña escala para ver si funciona.", "tipo": "riesgo", "frase": "Pruebas en pequeño y aprendes de lo que pasa: así empiezan muchos proyectos."}]}, {"n": 9, "texto": "Hay algo que te interesa que no se enseña en clase...", "opciones": [{"texto": "Buscas por tu cuenta recursos, practicas y vas corrigiendo sobre la marcha.", "tipo": "autonomia", "frase": "Aprendes por tu cuenta y vas corrigiendo sobre la marcha."}, {"texto": "Esperas a que alguien te lo enseñe o te lo ofrezcan.", "tipo": "persistencia", "frase": "Aprendes mejor con guía y estructura, y te gusta hacerlo bien desde la base."}, {"texto": "Lo dejas para otro momento, cuando tengas más tiempo.", "tipo": "valor", "frase": "Priorizas lo que tienes entre manos y eliges tu momento."}]}, {"n": 10, "texto": "Tienes que convencer a un grupo de que te apoyen tu propuesta y no todos están de acuerdo.", "opciones": [{"texto": "Insistes en tu punto de vista hasta que se cansen de discutir.", "tipo": "riesgo", "frase": "Defiendes con convicción las ideas en las que crees: los proyectos nuevos necesitan a alguien así."}, {"texto": "Preparas argumentos y datos, escuchas las objeciones y adaptas tu propuesta.", "tipo": "iniciativa", "frase": "Convences con argumentos y escuchando: lideras sin imponer."}, {"texto": "Dejas que se decida lo que quiera la mayoría y no defiendes tu idea.", "tipo": "iniciativa", "frase": "Valoras la cohesión del grupo por encima de ganar la discusión: mantienes a todos remando en la misma dirección."}]}, {"n": 11, "texto": "Realizas un ejercicio y no encuentras la solución correcta...", "opciones": [{"texto": "Pides ayuda a un@ profesor@ sin buscar el error tú mismo.", "tipo": "valor", "frase": "Sabes cuándo pedir ayuda y aprovechas a quien sabe más: tu tiempo rinde más."}, {"texto": "Vuelves a intentarlo para detectar el error.", "tipo": "persistencia", "frase": "Insistes y analizas hasta dar con el fallo: la constancia es lo tuyo."}, {"texto": "Te frustras y pasas al siguiente.", "tipo": "riesgo", "frase": "Priorizas avanzar y no te quedas atascado: cambias de frente con rapidez."}]}, {"n": 12, "texto": "Te quieres comprar una sudadera pero tus amigos te dicen que es más fea que una nevera por detrás.", "opciones": [{"texto": "Te la compras igualmente.", "tipo": "autonomia", "frase": "Tu criterio manda: no necesitas la aprobación de los demás."}, {"texto": "No la compras.", "tipo": "valor", "frase": "Tienes en cuenta la opinión de tu entorno y decides con prudencia."}, {"texto": "Preguntas hasta que alguien te de aprobación social y te la compres.", "tipo": "iniciativa", "frase": "Cuentas con tu gente antes de decidir: sabes que los proyectos se hacen con apoyo."}]}, {"n": 13, "texto": "Estás haciendo un examen tipo test en el que restan los fallos y no estas seguro de tu respuesta...", "opciones": [{"texto": "Marcas la que crees que es.", "tipo": "riesgo", "frase": "Asumes un riesgo calculado y confías en tu intuición."}, {"texto": "No la contestas.", "tipo": "valor", "frase": "Calculas el riesgo y proteges lo que ya tienes."}, {"texto": "Se la copias al de al lado.", "tipo": "iniciativa", "frase": "Cuando dudas, cuentas con quienes tienes cerca: te mueves bien entre personas."}]}]}</script>

/* ---------- nombre -> combinaciones (idéntico a Python) ---------- */
function palabras(t) { return t.normalize('NFD').toLowerCase().replace(/\bm\.?\u00aa/g, 'maria').replace(/['\u2019\u2018`\u00b4]/g, '').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(x => x && !PARTICULAS.has(x)); }

/* ---------- criptografía ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function huella(c) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fag1|' + c)); return [...new Uint8Array(h)].slice(0, 6).map(b => b.toString(16).padStart(2, '0')).join(''); }
async function abrir(rec, comb) {

    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(comb), 'PBKDF2', false, ['deriveKey']);
    const clave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(rec.s), iterations: MODELO.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.i) }, clave, b64(rec.c))));
  } catch (e) { return null; }
}
async function buscar(texto) {
  const pals = palabras(texto);
  if (pals.length < 2) return { error: 'Escribe al menos tu nombre y un apellido.' };
  if (!window.crypto || !crypto.subtle) return { error: 'Este navegador no puede abrir los resultados desde esta dirección. Prueba con otro navegador.' };
  for (const c of combinaciones(pals)) {
    const recs = TABLA[await huella(c)]; if (!recs) continue;
    const ok = (await Promise.all(recs.map(r => abrir(r, c)))).filter(Boolean);
    if (ok.length === 1) return { datos: ok[0] };
    if (ok.length > 1) return { error: 'Hay más de una persona con ese nombre. Añade tu segundo apellido.' };
  }
  return { error: `No encontramos ese nombre. Prueba solo con tu nombre y tu primer apellido, sin apodos (da igual si usas mayúsculas o tildes). Esta página tiene los resultados hasta el ${MODELO.fecha}: si hiciste el test después, todavía no está publicado. Si sigue sin salir, díselo a quien organiza el test.` };
}

const nombresTipos = ks => { const n = ks.map(k => MODELO.tipos[k].nombre.toLowerCase()); return n.length > 1 ? n.slice(0, -1).join(', ') + ' y ' + n.at(-1) : n[0]; };

  const mejor = Math.max(...otros.map(n));

  return E('section', { class: 'buscar', 'aria-labelledby': 't-grupo' }, E('div', { class: 'fichas', 'aria-hidden': 'true' }, ...ORDEN.map((k, i) => ficha(k, 44 + (i % 2) * 14, { anillo: false }))),
    E('h1', { id: 't-grupo', text: 'El grupo' }), E('p', { class: 'intro', text: 'Esta sección es solo para organizadores. Escribe el código de acceso para ver las cifras del grupo.' }), form,
    E('p', { class: 'nota', text: 'Las cifras del grupo están cifradas con ese código. Tu resultado personal no lo necesita.' }));
}

/* ---------- rutas y arranque ---------- */
let actual = null, claveGrupo = 'todos';
function rutaGrupo(c) { claveGrupo = c; if (location.hash !== '#grupo') location.hash = '#grupo'; else pintar(); }
function pintar() {
  const enGrupo = location.hash === '#grupo' && !!GRUPO_CIFRADO;
  $('#vista-buscar').hidden = enGrupo || !!actual; $('#vista-informe').hidden = enGrupo || !actual; $('#vista-grupo').hidden = !enGrupo;
  $('#nav-yo').setAttribute('aria-current', enGrupo ? 'false' : 'page'); $('#nav-grupo').setAttribute('aria-current', enGrupo ? 'page' : 'false');
  if (enGrupo) { $('#vista-grupo').replaceChildren(GRUPO ? grupoVista(claveGrupo) : bloqueo()); window.scrollTo(0, 0); if (!GRUPO) $('#codigo').focus(); }
}
function ponerInforme(p, animar) {
  const nuevo = informe(p, { animar }); $('#vista-informe').replaceWith(nuevo);
  $('#pdf').onclick = () => window.print();
  $('#otra').onclick = () => { actual = null; $('#nombre').value = ''; $('#error').textContent = ''; document.title = 'Tu perfil emprendedor'; location.hash = ''; pintar(); $('#nombre').focus(); };
}
function mostrar(p) {
  actual = p; document.title = 'Tu perfil emprendedor · ' + p.n.split(' ')[0];
  if (location.hash === '#grupo') history.replaceState(null, '', location.pathname);
  ponerInforme(p, true); pintar(); window.scrollTo(0, 0);
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#btn'), err = $('#error'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Buscando…';
  try { const r = await buscar($('#nombre').value); if (r.datos) mostrar(r.datos); else err.textContent = r.error; }
  catch (x) { err.textContent = 'Ha pasado algo inesperado. Recarga la página e inténtalo otra vez.'; }
  finally { btn.disabled = false; btn.textContent = 'Ver mi resultado'; }
});

(function iniciar() {
  const m = $('#marca');
  if (MARCA.icono || MARCA.logo) m.append(E('span', { class: 'placa' }, E('img', { src: MARCA.icono || MARCA.logo, alt: '' }))); else m.append(E('span', { class: 'sello' }, ORDEN.map(k => ficha(k, 16, { anillo: false }))));
  if (MARCA.logo) { const f = $('#firma'); f.hidden = false; f.append(E('div', { class: 'placa' }, E('img', { src: MARCA.logo, alt: MARCA.colegio || MARCA.nombre })), MARCA.colegio ? E('p', { text: MARCA.colegio }) : null, MARCA.fuente ? E('p', { text: `Tipografía de los títulos: ${MARCA.fuente}, licencia SIL OFL` }) : null); }
  m.append(E('span', { text: MARCA.nombre }));
  if (GRUPO_CIFRADO) $('#nav-grupo').hidden = false;
  $('#fichas-portada').append(...ORDEN.map((k, i) => ficha(k, 44 + (i % 2) * 14, { anillo: false })));
  addEventListener('hashchange', pintar);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (actual) ponerInforme(actual, false); pintar(); });
  pintar();
})();
</script>
