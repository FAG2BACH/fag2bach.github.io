<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Tu perfil emprendedor</title>
<style>
  :root {
    color-scheme: light;
    --suelo:#eef0f4; --papel:#ffffff; --tinta:#0f1115; --tinta2:#464b55; --suave:#6d7380;
    --linea:rgba(15,17,21,.14); --lavado:rgba(15,17,21,.05); --anillo:#ffffff;
    --foco:#2a78d6; --marca:#0f1115; --marca-txt:#ffffff; --oro:#d3b341;
    --nv0:#86b6ef; --nv1:#3987e5; --nv2:#1c5cab; --nv3:#0d366b;
    --display:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --texto:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --salida:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark;
      --suelo:#0d0e11; --papel:#171a1f; --tinta:#f2f3f5; --tinta2:#c2c6cf; --suave:#8d93a0;
      --linea:rgba(255,255,255,.16); --lavado:rgba(255,255,255,.06); --anillo:#171a1f;
      --foco:#6aa6f0; --marca:#f2f3f5; --marca-txt:#0f1115;
      --nv0:#184f95; --nv1:#256abf; --nv2:#3987e5; --nv3:#86b6ef; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--suelo); color:var(--tinta); font:16px/1.55 var(--texto); }
  h1,h2,h3,p,ol,ul { margin:0; padding:0; }
  ol,ul { list-style:none; }
  [hidden] { display:none !important; }
  a { color:inherit; }
  ::selection { background:var(--foco); color:#fff; }
  :focus-visible { outline:3px solid var(--foco); outline-offset:3px; border-radius:6px; }
  button { font:inherit; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }

  /* ---------- cabecera ---------- */
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; max-width:1080px; margin:0 auto; padding:18px 20px; }
  .marca { display:flex; align-items:center; gap:12px; text-decoration:none; font:700 15px/1.2 var(--display); letter-spacing:-.01em; }
  .marca .placa { display:grid; place-items:center; background:#fff; border-radius:10px; padding:3px 6px; box-shadow:0 0 0 1px var(--linea); }
  .marca .placa img { height:30px; width:auto; display:block; }
  .filete { height:3px; background:var(--oro); }
  .marca .sello { display:flex; gap:3px; }
  .top nav { display:flex; gap:4px; }
  .top nav a { text-decoration:none; padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; color:var(--tinta2); }
  .top nav a[aria-current="page"] { background:var(--marca); color:var(--marca-txt); }
  .top nav a:not([aria-current="page"]):hover { background:var(--lavado); }
  .top nav a { white-space:nowrap; }
  @media (max-width:520px) { .top { padding:14px 16px; } .marca > span:last-child { display:none; } .top nav a { padding:8px 12px; } }

  /* ---------- búsqueda ---------- */
  .buscar { max-width:640px; margin:0 auto; padding:clamp(28px,9vh,96px) 20px 80px; display:grid; gap:28px; }
  .buscar .fichas { display:flex; gap:10px; align-items:flex-end; }
  .buscar h1 { font:800 clamp(2.5rem,11vw,4.75rem)/.98 var(--display); letter-spacing:-.035em; text-wrap:balance; }
  .buscar .intro { font-size:18px; color:var(--tinta2); max-width:46ch; }
  .buscar form { display:grid; gap:10px; max-width:480px; }
  .buscar label { font-weight:650; font-size:15px; }
  input[type=text], input[type=password] { font:inherit; font-size:18px; height:58px; padding:0 18px; border-radius:16px; border:2px solid var(--linea); background:var(--papel); color:var(--tinta); width:100%; }
  input[type=text]:focus, input[type=password]:focus { border-color:var(--tinta); outline:none; }
  input[type=text]:focus-visible, input[type=password]:focus-visible { outline:3px solid var(--foco); outline-offset:2px; }
  .boton { height:58px; padding:0 26px; border-radius:16px; border:0; background:var(--marca); color:var(--marca-txt); font:700 17px var(--display); cursor:pointer; transition:transform .15s var(--salida); }
  .boton:active { transform:scale(.98); }
  .boton:disabled { opacity:.6; cursor:progress; }
  .boton.claro { background:transparent; color:var(--tinta); border:2px solid var(--linea); }
  .error { color:#b3261e; font-size:15px; min-height:1.5em; }
  @media (prefers-color-scheme: dark) { .error { color:#ff9a92; } }
  .nota { font-size:14px; color:var(--suave); max-width:46ch; }

  /* ---------- portada del resultado ---------- */
  .portada { --suelo-hero:var(--suelo); --txt-hero:var(--tinta); --txt2-hero:var(--tinta2); --raya-hero:var(--linea);
    background:var(--suelo-hero); color:var(--txt-hero); transition:background-color .7s var(--salida), color .7s var(--salida); }
  .portada.listo { --suelo-hero:var(--hero); --txt-hero:var(--hero-txt); --txt2-hero:var(--hero-txt2); --raya-hero:var(--hero-raya); }
  .portada .dentro { max-width:1080px; margin:0 auto; padding:clamp(16px,3vw,40px) 20px clamp(32px,6vw,72px); display:grid; gap:clamp(24px,4vw,40px) clamp(28px,5vw,64px); }
  .portada h1 { font:800 clamp(2.75rem,13vw,5.5rem)/.95 var(--display); letter-spacing:-.04em; text-wrap:balance; opacity:0; transform:translateY(14px); transition:opacity .6s var(--salida) .15s, transform .6s var(--salida) .15s; }
  .portada .lema { font:italic 500 clamp(1.1rem,3.6vw,1.5rem)/1.3 var(--display); color:var(--txt2-hero); margin-top:14px; max-width:28ch; opacity:0; transition:opacity .6s var(--salida) .3s; }
  .portada .hola { font-size:17px; color:var(--txt2-hero); margin-top:18px; opacity:0; transition:opacity .6s var(--salida) .4s; }
  .portada.listo h1, .portada.listo .lema, .portada.listo .hola { opacity:1; transform:none; }
  .portada .emblema { width:clamp(72px,18vw,112px); height:auto; display:block; margin-bottom:18px; opacity:0; transform:scale(.7); transition:opacity .5s var(--salida) .05s, transform .6s var(--salida) .05s; }
  .portada.listo .emblema { opacity:1; transform:none; }

  .tubos { display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(8px,2.4vw,18px); align-items:end; max-width:520px; }
  .tubo { display:grid; gap:8px; justify-items:center; }
  .pila { width:100%; height:var(--alto); display:flex; flex-direction:column-reverse; align-items:center; justify-content:flex-start; gap:var(--hueco); padding:8px 0; border:2.5px solid var(--raya-hero); border-radius:18px 18px 26px 26px; transition:border-color .6s var(--salida); }
  .tubo.gana .pila { border-color:var(--txt-hero); }
  .ficha { display:block; padding:0; border:0; background:none; cursor:pointer; line-height:0; border-radius:50%; }
  .ficha svg { display:block; width:var(--ficha); height:var(--ficha); }
  .tubo .cuenta { font:700 22px/1 var(--display); font-synthesis:none; }
  .tubo:not(.gana) .cuenta { color:var(--txt2-hero); font-weight:600; }
  .claves { margin-top:20px; display:grid; gap:7px; font-size:15px; max-width:520px; }
  .claves li { display:flex; align-items:center; gap:10px; color:var(--txt2-hero); }
  .claves li.gana { color:var(--txt-hero); font-weight:700; }
  .claves .n { margin-left:auto; font-variant-numeric:tabular-nums; }

  .puntos { max-width:520px; }
  .puntos .cifra { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .puntos strong { font:800 clamp(2rem,8vw,2.75rem)/1 var(--display); letter-spacing:-.03em; }
  .puntos .nivel { font:700 18px var(--display); color:var(--txt-hero); }
  .sellos { display:grid; grid-template-columns:repeat(13,1fr); gap:4px; margin:14px 0 12px; }
  .sellos i { aspect-ratio:1; border-radius:5px; border:2px solid var(--raya-hero); }
  .sellos i.on { background:var(--txt-hero); border-color:var(--txt-hero); }
  .puntos p { color:var(--txt2-hero); font-size:15px; }

  @media (min-width:900px) {
    .portada .dentro { grid-template-columns:1.05fr 1fr; grid-template-areas:"texto tubos" "puntos tubos"; align-items:center; row-gap:36px; }
    .portada .dentro > .texto { grid-area:texto; align-self:end; }
    .portada .dentro > .puntos { grid-area:puntos; align-self:start; }
    .portada .dentro > .tubos-col { grid-area:tubos; justify-self:end; width:100%; max-width:520px; }
  }

  /* ---------- secciones ---------- */
  .bloque { max-width:1080px; margin:0 auto; padding:clamp(40px,7vw,88px) 20px 0; display:grid; gap:24px; }
  .bloque > * { min-width:0; }
  .bloque > h2 { overflow-wrap:anywhere; font:800 clamp(1.75rem,6vw,2.75rem)/1.04 var(--display); letter-spacing:-.03em; text-wrap:balance; max-width:20ch; }
  .bloque .sub { color:var(--tinta2); max-width:60ch; font-size:17px; }
  @media (min-width:900px) {
    .bloque.partido { grid-template-columns:minmax(0,5fr) minmax(0,7fr); column-gap:56px; align-items:start; grid-auto-flow:row; }
    .bloque.partido > h2, .bloque.partido > .sub { grid-column:1; }
    .bloque.partido > .cuerpo { grid-column:2; grid-row:1 / span 3; }
  }
  .lectura { font-size:18px; line-height:1.6; max-width:62ch; display:grid; gap:14px; }
  .afines { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .pildora { display:inline-flex; align-items:center; gap:9px; padding:7px 14px 7px 9px; border-radius:999px; background:var(--papel); border:1.5px solid var(--linea); font-size:15px; font-weight:600; }

  .dims { display:grid; gap:22px; }
  .dim { display:grid; gap:7px; }
  .dim .cab { display:flex; align-items:center; gap:10px; font:700 17px var(--display); }
  .dim .cab .v { margin-left:auto; font-variant-numeric:tabular-nums; }
  .dim .pista { height:10px; border-radius:5px; background:var(--lavado); box-shadow:inset 0 0 0 1px var(--linea); overflow:hidden; }
  .dim .pista i { display:block; height:100%; border-radius:5px; background:var(--c); }
  .dim p { color:var(--tinta2); font-size:16px; max-width:56ch; }
  .dim .destaca { font:700 12px var(--display); letter-spacing:.02em; padding:2px 9px; border-radius:999px; background:var(--marca); color:var(--marca-txt); }

  .libro { display:grid; }
  .linea { display:grid; grid-template-columns:34px minmax(0,1fr); gap:4px 14px; padding:20px 0; border-top:1.5px solid var(--linea); scroll-margin-top:16px; }
  .linea:target { background:var(--lavado); box-shadow:-14px 0 0 var(--lavado), 14px 0 0 var(--lavado); }
  .linea .nº { font:800 22px/1.2 var(--display); color:var(--suave); font-variant-numeric:tabular-nums; }
  .linea .q { font-size:14.5px; color:var(--suave); }
  .linea .a { font:700 18px/1.35 var(--display); letter-spacing:-.01em; margin-top:2px; }
  .linea .f { color:var(--tinta2); margin-top:6px; }
  .linea .t { display:inline-flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; font-weight:700; }

  .compartes { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .compartes strong { font:800 clamp(2.4rem,9vw,3.6rem)/1 var(--display); letter-spacing:-.04em; }
  .compartes p { font-size:17px; color:var(--tinta2); max-width:34ch; }
  .calculo { color:var(--tinta2); font-size:15px; display:grid; gap:10px; max-width:70ch; }
  .acciones { display:flex; gap:12px; flex-wrap:wrap; padding:36px 20px 72px; max-width:1080px; margin:0 auto; }
  .acciones .boton { height:52px; font-size:16px; }
  .firma { display:grid; justify-items:center; gap:10px; padding:44px 20px 56px; border-top:1.5px solid var(--linea); max-width:1080px; margin:24px auto 0; text-align:center; }
  .firma .placa { background:#fff; border-radius:16px; padding:10px 14px; box-shadow:0 0 0 1px var(--linea); }
  .firma img { height:104px; width:auto; display:block; }
  .firma p { font-size:13px; color:var(--suave); }
  .pie { text-align:center; color:var(--suave); font-size:13px; padding:0 20px 40px; }

  /* ---------- grupo ---------- */
  .selector { display:inline-flex; flex-wrap:wrap; max-width:100%; justify-self:start; background:var(--lavado); border-radius:999px; padding:4px; gap:2px; box-shadow:inset 0 0 0 1px var(--linea); }
  .selector button { white-space:nowrap; border:0; background:none; padding:9px 16px; border-radius:999px; font-weight:650; font-size:15px; color:var(--tinta2); cursor:pointer; }
  .selector button[aria-pressed="true"] { background:var(--marca); color:var(--marca-txt); }
  .pictograma { display:grid; gap:20px; }
  .pictograma .fila { display:grid; gap:8px; }
  .pictograma .nombre { display:flex; align-items:center; gap:10px; font:700 17px var(--display); }
  .pictograma .nombre .p { margin-left:auto; font:800 20px var(--display); font-variant-numeric:tabular-nums; }
  .pictograma .nube { display:flex; flex-wrap:wrap; gap:4px; }
  .pictograma .nube svg { width:16px; height:16px; display:block; }
  .barra-niveles { display:flex; gap:3px; height:48px; }
  .barra-niveles span { display:grid; place-items:center; font:700 15px var(--display); border-radius:8px; min-width:0; overflow:hidden; }
  .leyenda-niveles { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; color:var(--tinta2); margin-top:10px; }
  .leyenda-niveles i { display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:7px; vertical-align:-1px; }
  details.situacion { border-top:1.5px solid var(--linea); padding:16px 0; }
  details.situacion:last-child { border-bottom:1.5px solid var(--linea); }
  details.situacion summary { cursor:pointer; display:grid; grid-template-columns:34px 1fr auto; gap:14px; align-items:baseline; list-style:none; }
  details.situacion summary::-webkit-details-marker { display:none; }
  details.situacion summary .nº { font:800 20px var(--display); color:var(--suave); }
  details.situacion summary .tx { font-weight:600; }
  details.situacion summary .top1 { font-size:14px; color:var(--suave); white-space:nowrap; }
  details.situacion .ops { display:grid; gap:14px; padding:16px 0 4px 48px; }
  .op { display:grid; grid-template-columns:22px minmax(0,1fr) 52px; gap:6px 12px; align-items:center; }
  .op .t { font-size:15px; }
  .op .p { text-align:right; font:800 17px var(--display); font-variant-numeric:tabular-nums; }
  .op .barra { grid-column:2 / 4; height:8px; border-radius:4px; background:var(--lavado); overflow:hidden; }
  .op .barra i { display:block; height:100%; background:var(--c); border-radius:4px; }
  @media (max-width:560px) { details.situacion summary { grid-template-columns:30px 1fr; } details.situacion summary .top1 { grid-column:2; } details.situacion .ops { padding-left:0; } }

  @media (prefers-reduced-motion: reduce) { * { transition-duration:.01ms !important; animation-duration:.01ms !important; } }

  @media print {
    @page { size:A4; margin:14mm; }
    body { background:#fff; color:#000; font-size:14px; }
    .top { padding:0 0 10px; max-width:none; }
    .top nav, .acciones, .pie, .selector, .filete { display:none !important; }
    .firma { padding:18px 0 0; margin-top:18px; } .firma img { height:60px; }
    .portada, .portada.listo { background:#fff !important; color:#000 !important; --txt-hero:#000; --txt2-hero:#333; --raya-hero:#999; border-top:2px solid #000; border-bottom:2px solid #000; }
    .portada h1, .portada .lema, .portada .hola, .portada .emblema { opacity:1 !important; transform:none !important; }
    .portada .dentro { max-width:none; padding:14px 0; grid-template-columns:1fr 1fr; grid-template-areas:"texto tubos" "puntos tubos"; gap:14px 24px; align-items:center; }
    .portada .dentro > .texto { grid-area:texto; }
    .portada .dentro > .puntos { grid-area:puntos; }
    .portada .dentro > .tubos-col { grid-area:tubos; }
    .portada h1 { font-size:2.8rem; } .portada .emblema { width:60px; margin-bottom:8px; } .portada .lema { font-size:1.05rem; margin-top:8px; }
    .portada .claves { font-size:12px; margin-top:10px; gap:4px; } .portada .puntos p { font-size:12px; }
    .bloque { max-width:none; padding:22px 0 0; gap:12px; }
    .bloque > h2 { font-size:1.45rem; max-width:none; }
    .bloque.partido { grid-template-columns:1fr 1.7fr; column-gap:24px; align-items:start; }
    .bloque.partido > h2, .bloque.partido > .sub { grid-column:1; }
    .bloque.partido > .cuerpo { grid-column:2; grid-row:1 / span 3; }
    .bloque .sub, .lectura { font-size:13.5px; } .dim p, .linea .f { font-size:12.5px; } .linea .a { font-size:15px; } .dims { gap:12px; }
    .linea { padding:10px 0; } .linea, .dim, .tubo { break-inside:avoid; }
    .compartes strong { font-size:2rem; }
    .compartes .boton { display:none !important; } .bloque > h2 { break-after:avoid; }
    .pildora { font-size:12px; padding:5px 12px 5px 7px; } .afines { gap:6px; margin-top:0; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="filete" aria-hidden="true"></div>
<header class="top">
  <a class="marca" href="#" id="marca" aria-label="Inicio"></a>
  <nav aria-label="Secciones"><a href="#" id="nav-yo">Mi resultado</a><a href="#grupo" id="nav-grupo" hidden>El grupo</a></nav>
</header>

<main id="main">
  <section class="buscar" id="vista-buscar" aria-labelledby="t-buscar">
    <div class="fichas" id="fichas-portada" aria-hidden="true"></div>
    <h1 id="t-buscar">Encuentra tu resultado</h1>
    <p class="intro">Tus respuestas del test se convierten en un tipo de emprendedor y un perfil. Escribe tu nombre y apellidos como los pusiste.</p>
    <form id="form" autocomplete="off" novalidate>
      <label for="nombre">Nombre y apellidos</label>
      <input id="nombre" name="nombre" type="text" inputmode="text" autocapitalize="words" spellcheck="false" placeholder="Escribe tu nombre y apellidos" required>
      <button class="boton" id="btn" type="submit">Ver mi resultado</button>
      <p class="error" id="error" role="alert" aria-live="polite"></p>
    </form>
    <p class="nota">Da igual si pones mayúsculas o tildes. Tu resultado está cifrado y solo se abre con tu nombre.</p>
    <noscript><p class="error">Esta página necesita JavaScript para abrir tu resultado.</p></noscript>
  </section>

  <article id="vista-informe" hidden></article>
  <section id="vista-grupo" hidden></section>
</main>

<script id="modelo" type="application/json">{"iter": 300000, "max": 26, "dims": [{"k": "iniciativa", "nombre": "Iniciativa y liderazgo", "corto": "Iniciativa", "descr": "Arrancar cosas sin que te lo pidan y mover a otros contigo.", "estilo": {"alto": "Te gusta tomar la iniciativa: propones, organizas y mueves a otros contigo.", "medio": "Combinas iniciativa y escucha: según la situación lideras o acompañas.", "bajo": "Prefieres observar y colaborar: aportas desde dentro del equipo más que desde el frente."}}, {"k": "autonomia", "nombre": "Autonomía", "corto": "Autonomía", "descr": "Aprender por tu cuenta y decidir sin depender de la aprobación de otros.", "estilo": {"alto": "Decides y aprendes por tu cuenta, con criterio propio.", "medio": "Equilibras tu propio criterio con lo que opinan quienes te rodean.", "bajo": "Te apoyas en tu entorno y en quienes saben más para decidir y aprender."}}, {"k": "riesgo", "nombre": "Riesgo e innovación", "corto": "Riesgo", "descr": "Probar ideas nuevas en pequeño y aceptar que no hay garantías.", "estilo": {"alto": "Pruebas ideas nuevas en pequeño y toleras bien la incertidumbre.", "medio": "Te atraen las ideas nuevas y las pruebas cuando ves una base sólida.", "bajo": "Prefieres avanzar sobre seguro y cuidar lo que ya funciona."}}, {"k": "persistencia", "nombre": "Persistencia y compromiso", "corto": "Persistencia", "descr": "Volver a intentarlo cuando algo sale mal y comprometerte con lo que quieres lograr.", "estilo": {"alto": "Te comprometes a fondo y no sueltas cuando algo se complica.", "medio": "Aguantas bien y sabes cuándo conviene pedir ayuda.", "bajo": "Cuidas tu energía y eliges con cuidado dónde ponerla."}}, {"k": "valor", "nombre": "Visión de valor e impacto", "corto": "Valor", "descr": "Ver dónde hay valor: en tu dinero, en tu tiempo y en los problemas reales.", "estilo": {"alto": "Ves oportunidades y valor donde otros ven gastos o quejas.", "medio": "Piensas en el valor de las cosas y lo tienes en cuenta al decidir. va", "riesgo"], "color": ["#e87ba4", "#d55181"]}}, "niveles": [{"min": 75, "nombre": "Alto impulso", "frase": "Tu forma de actuar encaja muy bien con el perfil emprendedor."}, {"min": 55, "nombre": "En marcha", "frase": "Tienes muchos rasgos emprendedores y ya los pones en práctica."}, {"min": 35, "nombre": "Despegando", "frase": "Tienes una base clara y varios rasgos que están cogiendo vuelo."}, {"min": 0, "nombre": "Explorando", "frase": "Tu forma de actuar combina estilos muy distintos y te estás descubriendo."}], "preguntas": [{"n": 1, "texto": "En tu grupo de amigos...", "opciones": [{"texto": "Propones y organizas planes.", "tipo": "iniciativa", "frase": "Eres quien mueve al grupo: propones, organizas y los demás se apuntan."}, {"texto": "Sigues lo que opina la mayoría.", "tipo": "persistencia", "frase": "Valoras el consenso y la armonía: aportas estabilidad al grupo."}, {"texto": "No miras el chat del grupo.", "tipo": "autonomia", "frase": "Llevas tu propio ritmo y no dependes de lo que pase en el grupo para decidir."}]}, {"n": 2, "texto": "¿Estarías dispuesto a sacrificar placeres de tu vida por sacar adelante un trabajo?", "opciones": [{"texto": "Considero más importante el trabajo que mi vida privada.", "tipo": "persistencia", "frase": "Te comprometes a fondo con lo que quieres sacar adelante y aceptas renunciar a cosas por ello."}, {"texto": "Es necesario que haya un equilibrio.", "tipo": "valor", "frase": "Piensas a largo plazo: sabes que rendir bien necesita equilibrio y descanso."}, {"texto": "Priorizo la vida privada sobre el ámbito profesional.", "tipo": "autonomia", "frase": "Tienes claro qué te importa y lo defiendes: tu vida va primero."}]}, {"n": 3, "texto": "¿Tienes interés en solucionar problemas reales en la sociedad?", "opciones": [{"texto": "Sí.", "tipo": "valor", "frase": "Te mueve resolver problemas reales: donde otros ven quejas, tú ves oportunidades."}, {"texto": "No.", "tipo": "autonomia", "frase": "Tienes tus propios intereses y prefieres centrarte en lo tuyo sin dispersarte."}, {"texto": "Solo lo que me afecte a mí.", "tipo": "riesgo", "frase": "Partes de lo que conoces de primera mano, que es como nacen muchos proyectos."}]}, {"n": 4, "texto": "Se cancela el viaje de fin de curso porque nadie lo ha organizado a tiempo...", "opciones": [{"texto": "Propones a unos compañeros organizarlo.", "tipo": "iniciativa", "frase": "Ante un problema actúas: reúnes a gente y lo organizas."}, {"texto": "Firmar la petición que haga otro grupo para que se considere.", "tipo": "iniciativa", "frase": "Sabes sumarte a iniciativas que ya tienen impulso y aprovechar lo que ya existe."}, {"texto": "Te quejas en el chat del grupo de clase y esperas a ver qué pasa.", "tipo": "autonomia", "frase": "Dices claramente lo que piensas y pones el tema sobre la mesa."}]}, {"n": 5, "texto": "Dentro de 10 años, ¿qué te haría sentir más realizado?", "opciones": [{"texto": "Estabilidad económica y horario predecible,", "tipo": "valor", "frase": "Valoras la seguridad y la planificación: te gusta construir sobre terreno firme."}, {"texto": "Haber construido algo propio que tenga tu sello, aunque el camino no haya estado lleno de rosas.", "tipo": "autonomia", "frase": "Quieres crear algo que lleve tu sello, aunque el camino no sea fácil."}, {"texto": "Ser reconocido socialmente por tu trabajo y contribución.", "tipo": "iniciativa", "frase": "Te motiva dejar huella y que tu aportación se reconozca."}]}, {"n": 6, "texto": "Un/a profesor/a dice que un ejercicio solo se puede resolver de una forma, pero tú ves otro camino que parece funcionar...", "opciones": [{"texto": "Lo haces como dice el profesor para evitar problemas.", "tipo": "persistencia", "frase": "Respetas el método y la guía: sabes que seguir el camino marcado evita tropiezos."}, {"texto": "Pruebas tu método, y se lo comentas.", "tipo": "riesgo", "frase": "Pruebas tu idea y la defiendes con transparencia: innovas a la vista de todos."}, {"texto": "Lo haces a tu manera sin comentarlo y esperas que cuele.", "tipo": "riesgo", "frase": "Confías en tu criterio y pruebas tu camino sin esperar permiso."}]}, {"n": 7, "texto": "Te regalan 350€ por tu cumpleaños. Lo más probable es que...", "opciones": [{"texto": "Los gastes pronto en algo que te apetezca.", "tipo": "riesgo", "frase": "Actúas rápido y disfrutas de lo que consigues: vives el presente."}, {"texto": "Los guardes todos en el banco sin tocarlos.", "tipo": "persistencia", "frase": "Eres constante y prudente: vas acumulando poco a poco."}, {"texto": "Los uses para algo que pueda devolverte más dinero o experiencias.", "tipo": "valor", "frase": "Piensas en el retorno: que tu dinero y tu tiempo trabajen para ti."}]}, {"n": 8, "texto": "Tienes una idea para un proyecto que podrías empezar ya pero nadie te asegura el éxito.", "opciones": [{"texto": "Esperas a tener todo muy claro y a que te den el visto bueno.", "tipo": "valor", "frase": "Quieres bases sólidas antes de moverte: prefieres decidir con información."}, {"texto": "La descartas, porque no merece la pena arriesgarse.", "tipo": "persistencia", "frase": "Cuidas tu energía y tus recursos, y eliges bien tus batallas."}, {"texto": "La pones en marcha a pequeña escala para ver si funciona.", "tipo": "riesgo", "frase": "Pruebas en pequeño y aprendes de lo que pasa: así empiezan muchos proyectos."}]}, {"n": 9, "texto": "Hay algo que te interesa que no se enseña en clase...", "opciones": [{"texto": "Buscas por tu cuenta recursos, practicas y vas corrigiendo sobre la marcha.", "tipo": "autonomia", "frase": "Aprendes por tu cuenta y vas corrigiendo sobre la marcha."}, {"texto": "Esperas a que alguien te lo enseñe o te lo ofrezcan.", "tipo": "persistencia", "frase": "Aprendes mejor con guía y estructura, y te gusta hacerlo bien desde la base."}, {"texto": "Lo dejas para otro momento, cuando tengas más tiempo.", "tipo": "valor", "frase": "Priorizas lo que tienes entre manos y eliges tu momento."}]}, {"n": 10, "texto": "Tienes que convencer a un grupo de que te apoyen tu propuesta y no todos están de acuerdo.", "opciones": [{"texto": "Insistes en tu punto de vista hasta que se cansen de discutir.", "tipo": "persistencia", "frase": "Eres tenaz: no sueltas una idea en la que crees."}, {"texto": "Preparas argumentos y datos, escuchas las objeciones y adaptas tu propuesta.", "tipo": "iniciativa", "frase": "Convences con argumentos y escuchando: lideras sin imponer."}, {"texto": "Dejas que se decida lo que quiera la mayoría y no defiendes tu idea.", "tipo": "valor", "frase": "Valoras la cohesión del grupo por encima de ganar la discusión."}]}, {"n": 11, "texto": "Realizas un ejercicio y no encuentras la solución correcta...", "opciones": [{"texto": "Pides ayuda a un@ profesor@ sin buscar el error tú mismo.", "tipo": "iniciativa", "frase": "Sabes cuándo pedir ayuda y aprovechas a quien sabe más."}, {"texto": "Vuelves a intentarlo para detectar el error.", "tipo": "persistencia", "frase": "Insistes y analizas hasta dar con el fallo: la constancia es lo tuyo."}, {"texto": "Te frustras y pasas al siguiente.", "tipo": "riesgo", "frase": "Priorizas avanzar y no te quedas atascado: cambias de frente con rapidez."}]}, {"n": 12, "texto": "Te quieres comprar una sudadera pero tus amigos te dicen que es más fea que una nevera por detrás.", "opciones": [{"texto": "Te la compras igualmente.", "tipo": "autonomia", "frase": "Tu criterio manda: no necesitas la aprobación de los demás."}, {"texto": "No la compras.", "tipo": "valor", "frase": "Tienes en cuenta la opinión de tu entorno y decides con prudencia."}, {"texto": "Preguntas hasta que alguien te de aprobación social y te la compres.", "tipo": "iniciativa", "frase": "Buscas apoyo y consenso antes de decidir: te importa lo que opinen los tuyos."}]}, {"n": 13, "texto": "Estás haciendo un examen tipo test en el que restan los fallos y no estas seguro de tu respuesta...", "opciones": [{"texto": "Marcas la que crees que es.", "tipo": "riesgo", "frase": "Asumes un riesgo calculado y confías en tu intuición."}, {"texto": "No la contestas.", "tipo": "valor", "frase": "Calculas el riesgo y proteges lo que ya tienes."}, {"texto": "Se la copias al de al lado.", "tipo": "iniciativa", "frase": "Cuando dudas, recurres a quienes tienes cerca."}]}]}</script>

<script>
'use strict';
const MODELO = JSON.parse(document.getElementById('modelo').textContent);
const TABLA = JSON.parse(document.getElementById('tabla').textContent);
const GRUPO_CIFRADO = JSON.parse(document.getElementById('grupo').textContent);   // las cifras del grupo solo se abren con el código
let GRUPO = null;
const MARCA = JSON.parse(document.getElementById('marca-datos').textContent);
const NS = 'http://www.w3.org/2000/svg';
const PARTICULAS = new Set(['de', 'del', 'la', 'las', 'los', 'el', 'y', 'e']);
const ORDEN = Object.keys(MODELO.tipos);
const $ = s => document.querySelector(s);
const E = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v); } kids.flat().forEach(c => c != null && e.append(typeof c === 'string' ? document.createTextNode(c) : c)); return e; };
const S = (tag, attrs = {}, ...kids) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); kids.flat().forEach(c => c != null && e.append(c)); return e; };
const fmt = x => Math.round(x).toLocaleString('es-ES');
const oscuro = () => matchMedia('(prefers-color-scheme: dark)').matches;
const hexTipo = k => MODELO.tipos[k].color[oscuro() ? 1 : 0];
const luz = h => { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126 * r + .7152 * g + .0722 * b; };
const sobre = h => { const L = luz(h); return 1.05 / (L + .05) >= (L + .05) / .0555 ? '#ffffff' : '#0f1115'; };
const nivelDim = v => v >= 70 ? 'alto' : v >= 40 ? 'medio' : 'bajo';
const reducido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* colores de los tipos como variables (claro y oscuro) */
const sty = document.createElement('style');
const vars = i => Object.entries(MODELO.tipos).map(([k, t]) => `--tipo-${k}:${t.color[i]};`).join('');
const marcaCss = (c, txt) => c ? `--marca:${c};--marca-txt:${txt};--foco:${c};` : '';
sty.textContent = `:root{${vars(0)}${marcaCss(MARCA.color, '#ffffff')}${MARCA.acento ? `--oro:${MARCA.acento};` : ''}}@media (prefers-color-scheme: dark){:root{${vars(1)}${marcaCss(MARCA.color_oscuro || MARCA.color, '#0f1115')}}}`;
document.head.append(sty);

/* ---------- fichas: cada tipo tiene su color y su forma ---------- */
const FORMAS = {
  iniciativa: 'M24 6.5 L42.2 39 Q43.6 41.5 40.8 41.5 L7.2 41.5 Q4.4 41.5 5.8 39 Z',
  autonomia: 'M12 7 H36 Q41 7 41 12 V36 Q41 41 36 41 H12 Q7 41 7 36 V12 Q7 7 12 7 Z',
  riesgo: 'M24 6 A18 18 0 1 1 23.99 6 Z',
  persistencia: 'M24 5.5 L40.3 14.7 V33.3 L24 42.5 L7.7 33.3 V14.7 Z',
  valor: 'M24 4.5 L43.5 24 L24 43.5 L4.5 24 Z',
};
const GLIFOS = {
  iniciativa: 'M24 34 V21 M18 26 L24 20 L30 26',
  autonomia: 'M15 31 Q21 14 26 26 T34 18',
  riesgo: 'M24 14 L29 24 L24 34 L19 24 Z',
  persistencia: 'M16 31 H32 M18 25 H30 M21 19 H27',
  valor: 'M24 15 L33 24 L24 33 L15 24 Z',
};
function ficha(k, tam = 28, { glifo = false, anillo = true, color } = {}) {
  const svg = S('svg', { viewBox: '0 0 48 48', width: tam, height: tam, 'aria-hidden': 'true', focusable: 'false' });
  const c = color || `var(--tipo-${k})`;
  svg.append(S('path', { d: FORMAS[k], fill: c, stroke: anillo ? 'var(--anillo)' : c, 'stroke-width': anillo ? 5 : 4, 'stroke-linejoin': 'round', 'paint-order': 'stroke fill' }));
  if (glifo) svg.append(S('path', { d: GLIFOS[k], fill: 'none', stroke: glifo, 'stroke-width': 3.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  return svg;
}

/* ---------- nombre -> combinaciones (idéntico a Python) ---------- */
function palabras(t) { return t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(x => x && !PARTICULAS.has(x)); }
function combos(a, k, ini = 0, acc = [], out = []) { if (acc.length === k) { out.push(acc.join(' ')); return out; } for (let i = ini; i < a.length; i++) combos(a, k, i + 1, [...acc, a[i]], out); return out; }
function combinaciones(p) { p = [...p].sort(); const n = p.length, t = new Set([n]); if (n >= 2) { t.add(2); t.add(3); } const s = new Set(); for (const k of t) if (k <= n) combos(p, k).forEach(c => s.add(c)); return [...s].sort((a, b) => b.split(' ').length - a.split(' ').length); }

/* ---------- criptografía ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function huella(c) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fag1|' + c)); return [...new Uint8Array(h)].slice(0, 6).map(b => b.toString(16).padStart(2, '0')).join(''); }
async function abrir(rec, comb) {
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(comb), 'PBKDF2', false, ['deriveKey']);
    const clave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(rec.s), iterations: MODELO.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(rec.i) }, clave, b64(rec.c))));
  } catch (e) { return null; }
}
async function buscar(texto) {
  const pals = palabras(texto);
  if (pals.length < 2) return { error: 'Escribe al menos tu nombre y un apellido.' };
  if (!window.crypto || !crypto.subtle) return { error: 'Este navegador no puede abrir los resultados desde esta dirección. Prueba con otro navegador.' };
  for (const c of combinaciones(pals)) {
    const recs = TABLA[await huella(c)]; if (!recs) continue;
    const ok = (await Promise.all(recs.map(r => abrir(r, c)))).filter(Boolean);
    if (ok.length === 1) return { datos: ok[0] };
    if (ok.length > 1) return { error: 'Hay más de una persona con ese nombre. Añade tu segundo apellido.' };
  }
  return { error: 'No encontramos ese nombre. Escríbelo como lo pusiste en el test, con tus apellidos.' };
}

/* ---------- informe ---------- */
function respuestasPorTipo(p) {
  const por = Object.fromEntries(ORDEN.map(k => [k, []]));
  MODELO.preguntas.forEach((q, i) => { const o = q.opciones[p.r[i]]; if (o) por[o.tipo].push(q.n); });
  return por;
}

function tubos(p, por) {
  const max = Math.max(1, ...ORDEN.map(k => por[k].length));
  const paso = Math.min(34, 250 / max), tam = Math.max(14, paso - 4);
  const cont = E('div', { class: 'tubos', role: 'group', 'aria-label': 'Tus 13 respuestas repartidas entre los cinco tipos' });
  cont.style.setProperty('--ficha', tam + 'px'); cont.style.setProperty('--hueco', (paso - tam) + 'px'); cont.style.setProperty('--alto', (max * paso + 16) + 'px');
  ORDEN.forEach(k => {
    const pila = E('div', { class: 'pila' });
    por[k].forEach(n => { const b = E('a', { class: 'ficha', href: `#resp-${n}`, 'aria-label': `Respuesta ${n}: ${MODELO.tipos[k].nombre}`, title: `Respuesta ${n}` }); b.append(ficha(k, tam, k === p.t ? { color: 'var(--txt-hero)', anillo: false } : {})); pila.append(b); });
    cont.append(E('div', { class: 'tubo' + (k === p.t ? ' gana' : ''), 'data-k': k }, pila, E('div', { class: 'cuenta num', text: String(por[k].length) })));
  });
  return cont;
}

function animarFichas(portada, cont) {
  let hecho = false;
  const fin = () => { if (!hecho) { hecho = true; portada.classList.add('listo'); } };
  if (reducido() || !cont.animate) { fin(); return; }
  const fichas = [...cont.querySelectorAll('.ficha')].sort((a, b) => parseInt(a.getAttribute('href').slice(6)) - parseInt(b.getAttribute('href').slice(6)));
  const anims = fichas.map((f, i) => f.animate([{ transform: 'translateY(-340px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 640, delay: i * 85, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
  // la portada se tiñe cuando la última ficha ha caído (y, por si la pestaña está en segundo plano, como mucho a los 4 s)
  Promise.all(anims.map(a => a.finished)).then(() => setTimeout(fin, 120)).catch(fin);
  setTimeout(fin, 4000);
}

function informe(p, { animar = true } = {}) {
  const tipo = MODELO.tipos[p.t], tipo2 = MODELO.tipos[p.t2];
  const nivel = MODELO.niveles.find(n => p.g >= n.min) || MODELO.niveles.at(-1);
  const por = respuestasPorTipo(p), total = ORDEN.reduce((s, k) => s + por[k].length, 0);
  const raiz = E('article', { id: 'vista-informe' });

  // portada
  const hx = hexTipo(p.t), txt = sobre(hx);
  const portada = E('section', { class: 'portada', 'aria-labelledby': 'titulo' });
  portada.style.setProperty('--hero', hx); portada.style.setProperty('--hero-txt', txt);
  portada.style.setProperty('--hero-txt2', txt === '#ffffff' ? 'rgba(255,255,255,.9)' : 'rgba(15,17,21,.84)');
  portada.style.setProperty('--hero-raya', txt === '#ffffff' ? 'rgba(255,255,255,.45)' : 'rgba(15,17,21,.36)');
  const em = ficha(p.t, 112, { glifo: hx, anillo: false, color: 'var(--txt-hero)' }); em.setAttribute('class', 'emblema');
  const cont = tubos(p, por);
  const claves = E('ul', { class: 'claves' }, ORDEN.map(k => E('li', { class: k === p.t ? 'gana' : '' }, ficha(k, 20, k === p.t ? { color: 'var(--txt-hero)', anillo: false } : {}), MODELO.tipos[k].nombre, E('span', { class: 'n', text: `${por[k].length} de ${total}` }))));
  const nSellos = Math.round(p.g / 100 * MODELO.max);
  const puntos = E('div', { class: 'puntos' }, E('div', { class: 'cifra' }, E('strong', { class: 'num', text: `${fmt(p.g)} %` }), E('span', { class: 'nivel', text: nivel.nombre })),
    E('div', { class: 'sellos', role: 'img', 'aria-label': `${nSellos} de ${MODELO.max} puntos` }, Array.from({ length: MODELO.max }, (_, i) => E('i', { class: i < nSellos ? 'on' : '' }))),
    E('p', { text: `${nivel.frase} No es una nota: indica cuánto se parece tu forma de actuar al perfil emprendedor típico de este test.` }));
  portada.append(E('div', { class: 'dentro' },
    E('div', { class: 'texto' }, em, E('h1', { id: 'titulo', tabindex: '-1', text: tipo.nombre }), E('p', { class: 'lema', text: tipo.lema }), E('p', { class: 'hola', text: `${p.n.split(' ')[0]}, este es tu resultado.` })),
    E('div', { class: 'tubos-col' }, cont, claves), puntos));
  raiz.append(portada);

  // cómo eres
  const afines = tipo.encaja.map(k => E('span', { class: 'pildora' }, ficha(k, 24), `Encajas con ${MODELO.tipos[k].nombre.toLowerCase()}`));
  raiz.append(E('section', { class: 'bloque partido' }, E('h2', { text: 'Así eres' }), E('div', { class: 'cuerpo lectura' }, E('p', { text: tipo.descr }), E('p', { text: tipo.equipo }),
    E('p', { text: `Tu segundo tipo es ${tipo2.nombre.toLowerCase()}: ${por[p.t2].length === por[p.t].length ? 'empatas con él en número de respuestas.' : `${por[p.t2].length} de tus ${total} respuestas apuntan a él.`}` }),
    E('div', { class: 'afines' }, afines))));

  // dimensiones
  const top = new Set(p.f);
  raiz.append(E('section', { class: 'bloque partido' }, E('h2', { text: 'Tus cinco formas de actuar' }), E('p', { class: 'sub', text: 'De 0 a 100. Cada una combina varias de tus respuestas.' }),
    E('div', { class: 'cuerpo dims' }, MODELO.dims.map(d => E('div', { class: 'dim' }, E('div', { class: 'cab' }, ficha(d.k, 26), E('span', { text: d.nombre }), top.has(d.k) ? E('span', { class: 'destaca', text: 'Destaca' }) : null, E('span', { class: 'v num', text: fmt(p.d[d.k]) })),
      E('div', { class: 'pista' }, E('i', { style: `--c:var(--tipo-${d.k});width:${Math.max(3, p.d[d.k])}%` })), E('p', { text: d.estilo[nivelDim(p.d[d.k])] }))))));

  // respuestas
  raiz.append(E('section', { class: 'bloque' }, E('h2', { text: 'Tus 13 respuestas, una a una' }), E('p', { class: 'sub', text: 'Esto dice de ti cada cosa que elegiste y el tipo al que apunta.' }),
    E('ol', { class: 'libro' }, MODELO.preguntas.map((q, i) => { const o = q.opciones[p.r[i]]; if (!o) return null; const t = MODELO.tipos[o.tipo];
      return E('li', { class: 'linea', id: `resp-${q.n}` }, E('span', { class: 'nº num', text: String(q.n) }), E('div', {}, E('p', { class: 'q', text: q.texto }), E('p', { class: 'a', text: `«${o.texto}»` }), E('p', { class: 'f', text: o.frase }), E('span', { class: 't' }, ficha(o.tipo, 24), t.nombre))); }))));

  // grupo
  if (p.gr != null) raiz.append(E('section', { class: 'bloque' }, E('h2', { text: 'Y en tu grupo' }), E('div', { class: 'compartes' }, E('strong', { class: 'num', text: `${fmt(p.gr)} %` }), E('p', { text: `del grupo comparte tu tipo, ${tipo.nombre.toLowerCase()}.` }))));

  // cálculo
  raiz.append(E('section', { class: 'bloque' }, E('h2', { text: 'Cómo se ha calculado' }), E('div', { class: 'calculo' },
    E('p', { text: `Tu índice sale de 13 respuestas que valen 0, 1 o 2 puntos (máximo ${MODELO.max}): el total entre el máximo, por 100. Tu tipo es el que más aparece entre tus respuestas. Cada forma de actuar se calcula con las dos o tres preguntas que la miden.` }),
    E('p', { text: 'Es un test de autopercepción: una foto de cómo te ves hoy, no una nota ni un diagnóstico. Si lo repites dentro de un tiempo, es normal que cambie.' }))));

  raiz.append(E('div', { class: 'acciones' }, E('button', { class: 'boton', type: 'button', id: 'pdf', text: 'Guardar como PDF' }), E('button', { class: 'boton claro', type: 'button', id: 'otra', text: 'Buscar a otra persona' })),
    E('p', { class: 'pie', text: 'Tus resultados están cifrados y solo se abren con tu nombre.' }));
  if (animar) animarFichas(portada, cont); else portada.classList.add('listo');
  return raiz;
}

/* ---------- grupo ---------- */
const CURSOS = { '1B': '1º Bach.', '2B': '2º Bach.' };
function grupoVista(clave) {
  const g = GRUPO.vistas[clave];
  const raiz = E('div', {});
  const cab = E('div', { class: 'bloque' }, E('h2', { text: `El grupo: ${g.n} personas` }), E('p', { class: 'sub', text: `Cada ficha es una persona. Nunca se muestran nombres ni resultados individuales. Índice medio del grupo: ${fmt(g.media)} %.` }));
  const claves = Object.keys(GRUPO.vistas);
  if (claves.length > 1) cab.append(E('div', { class: 'selector', role: 'group', 'aria-label': 'Curso' }, claves.map(c => { const b = E('button', { type: 'button', 'aria-pressed': String(c === clave), text: c === 'todos' ? 'Todos' : (CURSOS[c] || c) }); b.onclick = () => rutaGrupo(c); return b; })));
  raiz.append(cab);

  raiz.append(E('section', { class: 'bloque' }, E('h2', { text: 'Qué tipos hay' }), E('div', { class: 'pictograma' }, ORDEN.map(k => { const n = g.tipos[k];
    return E('div', { class: 'fila' }, E('div', { class: 'nombre' }, ficha(k, 26), MODELO.tipos[k].nombre, E('span', { class: 'p num', text: `${fmt(n / g.n * 100)} %` })),
      E('div', { class: 'nube', 'aria-label': `${n} personas` }, Array.from({ length: n }, () => ficha(k, 16, { anillo: false })))); }))));

  raiz.append(E('section', { class: 'bloque partido' }, E('h2', { text: 'Perfil medio del grupo' }), E('p', { class: 'sub', text: 'Media de cada forma de actuar, de 0 a 100.' }),
    E('div', { class: 'cuerpo dims' }, MODELO.dims.map(d => E('div', { class: 'dim' }, E('div', { class: 'cab' }, ficha(d.k, 26), E('span', { text: d.nombre }), E('span', { class: 'v num', text: fmt(g.dims[d.k]) })), E('div', { class: 'pista' }, E('i', { style: `--c:var(--tipo-${d.k});width:${Math.max(3, g.dims[d.k])}%` })), E('p', { text: d.descr }))))));

  const nivs = [...MODELO.niveles].reverse();   // de menos a más
  const col = i => `var(--nv${i})`, textoNv = i => (oscuro() ? ['#fff', '#fff', '#0f1115', '#0f1115'] : ['#0f1115', '#0f1115', '#fff', '#fff'])[i];
  raiz.append(E('section', { class: 'bloque' }, E('h2', { text: 'Niveles' }), E('div', {}, E('div', { class: 'barra-niveles', role: 'img', 'aria-label': 'Reparto por niveles' }, nivs.map((nv, i) => { const n = g.niveles[nv.nombre] || 0, w = n / g.n * 100; return E('span', { style: `flex:${Math.max(w, .0001)} 1 0;background:${col(i)};color:${textoNv(i)}`, title: `${nv.nombre}: ${n}`, text: w >= 9 ? `${fmt(w)} %` : '' }); })),
    E('div', { class: 'leyenda-niveles' }, nivs.map((nv, i) => E('span', {}, E('i', { style: `background:${col(i)}` }), `${nv.nombre} (${nv.min}+)`))))));

  raiz.append(E('section', { class: 'bloque' }, E('h2', { text: 'En cada situación, qué elige el grupo' }), E('p', { class: 'sub', text: 'Pulsa una situación para ver el reparto entre las tres opciones.' }),
    E('div', {}, MODELO.preguntas.map((q, i) => { const c = g.preguntas[i], tot = c.reduce((a, b) => a + b, 0) || 1, mx = Math.max(...c);
      return E('details', { class: 'situacion' }, E('summary', {}, E('span', { class: 'nº num', text: String(q.n) }), E('span', { class: 'tx', text: q.texto }), E('span', { class: 'top1 num', text: `la más elegida: ${fmt(mx / tot * 100)} %` })),
        E('div', { class: 'ops' }, q.opciones.map((o, j) => E('div', { class: 'op' }, ficha(o.tipo, 22), E('span', { class: 't', text: o.texto }), E('span', { class: 'p num', text: `${fmt(c[j] / tot * 100)} %` }), E('div', { class: 'barra' }, E('i', { style: `--c:var(--tipo-${o.tipo});width:${c[j] / tot * 100}%` })))))); }))));
  raiz.append(E('p', { class: 'pie', style: 'margin-top:48px', text: 'Cifras agregadas. Solo se muestran grupos de 20 personas o más.' }));
  return raiz;
}

/* ---------- acceso al grupo con código ---------- */
function bloqueo() {
  const err = E('p', { class: 'error', role: 'alert', 'aria-live': 'polite' });
  const entrada = E('input', { id: 'codigo', type: 'password', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', placeholder: 'Código de acceso', 'aria-label': 'Código de acceso' });
  const boton = E('button', { class: 'boton', type: 'submit', text: 'Entrar' });
  const form = E('form', { novalidate: '' }, E('label', { for: 'codigo', text: 'Código de acceso' }), entrada, boton, err);
  form.onsubmit = async e => {
    e.preventDefault(); err.textContent = ''; boton.disabled = true; boton.textContent = 'Comprobando…';
    const abierto = await abrir(GRUPO_CIFRADO, entrada.value.trim().toLowerCase().replace(/\s+/g, ''));
    boton.disabled = false; boton.textContent = 'Entrar';
    if (abierto) { GRUPO = abierto; pintar(); } else { err.textContent = 'Código incorrecto.'; entrada.select(); }
  };
  return E('section', { class: 'buscar', 'aria-labelledby': 't-grupo' }, E('div', { class: 'fichas', 'aria-hidden': 'true' }, ...ORDEN.map((k, i) => ficha(k, 44 + (i % 2) * 14, { anillo: false }))),
    E('h1', { id: 't-grupo', text: 'El grupo' }), E('p', { class: 'intro', text: 'Esta sección es solo para organizadores. Escribe el código de acceso para ver las cifras del grupo.' }), form,
    E('p', { class: 'nota', text: 'Las cifras del grupo están cifradas con ese código. Tu resultado personal no lo necesita.' }));
}

/* ---------- rutas y arranque ---------- */
let actual = null, claveGrupo = 'todos';
function rutaGrupo(c) { claveGrupo = c; if (location.hash !== '#grupo') location.hash = '#grupo'; else pintar(); }
function pintar() {
  const enGrupo = location.hash === '#grupo' && !!GRUPO_CIFRADO;
  $('#vista-buscar').hidden = enGrupo || !!actual; $('#vista-informe').hidden = enGrupo || !actual; $('#vista-grupo').hidden = !enGrupo;
  $('#nav-yo').setAttribute('aria-current', enGrupo ? 'false' : 'page'); $('#nav-grupo').setAttribute('aria-current', enGrupo ? 'page' : 'false');
  if (enGrupo) { $('#vista-grupo').replaceChildren(GRUPO ? grupoVista(claveGrupo) : bloqueo()); window.scrollTo(0, 0); if (!GRUPO) $('#codigo').focus(); }
}
function ponerInforme(p, animar) {
  const nuevo = informe(p, { animar }); $('#vista-informe').replaceWith(nuevo);
  $('#pdf').onclick = () => window.print();
  $('#otra').onclick = () => { actual = null; $('#nombre').value = ''; $('#error').textContent = ''; document.title = 'Tu perfil emprendedor'; location.hash = ''; pintar(); $('#nombre').focus(); };
}
function mostrar(p) {
  actual = p; document.title = 'Tu perfil emprendedor · ' + p.n.split(' ')[0];
  if (location.hash === '#grupo') history.replaceState(null, '', location.pathname);
  ponerInforme(p, true); pintar(); window.scrollTo(0, 0);
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#btn'), err = $('#error'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Buscando…';
  try { const r = await buscar($('#nombre').value); if (r.datos) mostrar(r.datos); else err.textContent = r.error; }
  catch (x) { err.textContent = 'Ha pasado algo inesperado. Recarga la página e inténtalo otra vez.'; }
  finally { btn.disabled = false; btn.textContent = 'Ver mi resultado'; }
});

(function iniciar() {
  const m = $('#marca');
  if (MARCA.icono || MARCA.logo) m.append(E('span', { class: 'placa' }, E('img', { src: MARCA.icono || MARCA.logo, alt: '' }))); else m.append(E('span', { class: 'sello' }, ORDEN.map(k => ficha(k, 16, { anillo: false }))));
  if (MARCA.logo) { const f = $('#firma'); f.hidden = false; f.append(E('div', { class: 'placa' }, E('img', { src: MARCA.logo, alt: MARCA.colegio || MARCA.nombre })), MARCA.colegio ? E('p', { text: MARCA.colegio }) : null); }
  m.append(E('span', { text: MARCA.nombre }));
  if (GRUPO_CIFRADO) $('#nav-grupo').hidden = false;
  $('#fichas-portada').append(...ORDEN.map((k, i) => ficha(k, 44 + (i % 2) * 14, { anillo: false })));
  addEventListener('hashchange', pintar);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (actual) ponerInforme(actual, false); pintar(); });
  pintar();
})();
</script>
